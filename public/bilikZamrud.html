<script src="script/loadHeadFoot.js"></script>
<div id="header-placeholder"></div>
<script type="module">
    import { validateDate } from './script/roomBooking.js';
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        document.getElementById('nama-bilik').value = roomParam;
      }
      const dateInput = document.getElementById('tarikh');
      dateInput.addEventListener('click', validateDate);
    });
</script>
    <div class="page">
        <div class="bilik-content">
            <div class="bilik-info-container">
                <section class="slider">
                  <div class="slides">
                    <img src="img/BilikZamrudMain.jpg" alt="Gambar zamrud" class="bilik-img">
                    <img src="img/Zamrud2.jpg" alt="Gambar zamrud" class="bilik-img">
                    <img src="img/ZamrudDatukB.jpg" alt="Gambar zamrud" class="bilik-img">
                  </div>
                  <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
                  <button class="next" onclick="changeSlide(1)">&#10095;</button>
                </section>
                <section class="bilik-info">
                    <h2 style="font-size: 2rem;">Bilik Zamrud</h2>
                    <p>Kapasiti: 33 Orang</p>
                    <p>Mikrofon pada setiap meja</p>
                    <p>Poin socket pengecas pada setiap meja</p>
                    <p>Papan Putih: 1 unit</p>
                    <p>Televisyen: 3 unit</p>
                    <p>Projektor & Skrin</p>
                </section>
            </div>
            <section class="bilik-form">
                <h1>Maklumat Tempahan</h1>
                <form action="" method="post">
                    <div class="input-box">
                        <label for="bilik">Nama Bilik:</label>
                        <input type="text" id="nama-bilik" name="nama-bilik" required readonly>
                    </div>
                    <div class="input-box">
                        <label for="tajuk">Tajuk Mesyuarat:</label>
                        <input type="text" id="tajuk" name="tajuk" required>
                    </div>
                    <div class="input-box">
                        <label for="tarikh">Tarikh:</label>
                        <input type="date" id="tarikh" name="tarikh" required>
                    </div>

                    <div class="input-box">
                        <label for="sesi">Sesi:</label>
                        <select id="sesi" name="sesi" required>
                            <option value="pilih" selected>Pilih Sesi...</option>
                            <option value="pagi">Sesi Pagi</option>
                            <option value="petang">Sesi Petang</option>
                        </select>.
                    </div>
                    <div class="input-box center-sebab">
                      <label for="sebab">Sebab Keperluan:</label>
                      <textarea id="sebab" name="sebab"></textarea>
                    </div>
                    <div class="input-box checkbox-container">
                      <label for="checkbox">Tempahan Makanan & Minuman:</label>
                      <div class="makan-minum-checkbox">
                        <input type="checkbox" id="makan-checkbox" name="makan-minum">
                        <label for="makan-checkbox">Makanan</label>
        
                        <input type="checkbox" id="minum-checkbox" name="makan-minum">
                        <label for="minum-checkbox">Minuman</label>
                      </div>
                    </div>

                    <button type="button" id="bilik-tempah-btn" class="tempah-btn-bilik">TEMPAH</button>
                </form>
            </section>
        </div>
    </div>
    <script src="script/roomBooking.js" type="module">
    </script>
    <script>
      let currentIndex = 0;
      const slides = document.querySelectorAll('.slides img');
      
      function showSlide(n) {
        slides.forEach((slide, index) => {
          slide.style.display = (index === n) ? 'block' : 'none';
        });
      }
    
      function changeSlide(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = slides.length - 1;
        if (currentIndex >= slides.length) currentIndex = 0;
        showSlide(currentIndex);
      }
    
      // Show the first image on page load
      showSlide(currentIndex);
    </script>
    <div id="footer-placeholder"></div>
</body>
</html>
