<script src="script/loadHeadFoot.js"></script>
<div id="header-placeholder"></div>
        <div class="login-page">
            <div class="login-text">
                <h1>Selamat Datang </h1>
                <h4>Masukkan Maklumat Anda Untuk Log Masuk</h4>
            </div>
            <div class="login-box">
                <form action="" method="POST">
                    <div class="form-group">
                        <label for="email"><i class="fas fa-email"></i> Emel:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Kata Laluan:</label>
                        <div class="form-group-pic">
                            <input type="password" id="password" name="password" required>
                            <img src="img/eye-close.png" id="eye">
                        </div>
                    </div>
                    <button type="submit" name="login" id="log-btn" class="login-btn">LOG MASUK</button>
                </form>
                
                <p>Pengguna Baharu? <a href="registerUser.html">Daftar Disini</a></p> 
                <p><a href="adminLogin.html">Klik Disini</a> Untuk Pentadbir</p>
            </div>
        </div>

        <script src="script/showPass.js"></script>
        <script type="module">
            import { loginUser } from './script/getPostData.js';
            import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

            const submitButton = document.getElementById('log-btn');
            submitButton.addEventListener('click', async (event) =>{
                event.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    alert('Please fill in all fields');
                    return;
                }

                const auth = getAuth();
                signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in 
                    const user = userCredential.user;
                    alert('Log Masuk Berjaya');
                    window.location.href = 'mainPage.html';
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.log(errorMessage);

                    if (errorCode === 'auth/invalid-credential') {
                        alert('Emel atau Kata Laluan Tidak Sah');
                    }
                });
               
            });
        </script>

        <div id="footer-placeholder"></div>
