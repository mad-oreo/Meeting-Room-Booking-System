<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempahan Bilik Mesyuarat</title>
    <link rel="icon" type="image/svg" href="img/Coat_of_Arms_of_Kuala_Lumpur.svg">
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="stylesheet" href="node_modules/@flaticon/flaticon-uicons/css/all/all.css"> -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:500&display=swap" rel="stylesheet">
    <script src="script/loadHeadFoot.js"></script>
</head>
<body>
    <header class="navbar">
            <img src="img/Coat_of_Arms_of_Kuala_Lumpur.svg" 
            alt="Logo DBKL" 
            class="logo"><a href="#"></a>
            <div class="logo-text">
                <h2>INSTITUT LATIHAN</h2>
                <h3>DEWAN BANDARAYA KUALA LUMPUR</h3>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="#">Laman Utama</a> |</li>
                    <li><a href="#">Lihat Tempahan</a> |</li>
                    <li><a href="#">Profil</a> </li>
                </ul>
            <nav>
        </header>

        <div class="login-page">
            <div class="login-text">
                <h1>Selamat Datang </h1>
                <h4>Masukkan Maklumat Anda Untuk Log Masuk</h4>
            </div>
            <div class="login-box">
                <form action="" method="POST">
                    <div class="form-group">
                        <label for="email"><i class="fas fa-email"></i> Emel:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Kata Laluan:</label>
                        <div class="form-group-pic">
                            <input type="password" id="password" name="password" required>
                            <img src="img/eye-close.png" id="eye">
                        </div>
                    </div>
                    <button type="submit" name="login" id="log-btn" class="login-btn">LOG MASUK</button>
                </form>
                
                <p>Pengguna Baharu? <a href="registerUser.html">Daftar Disini</a></p> 
                <p><a href="adminLogin.html">Klik Disini</a> Untuk Pentadbir</p>
            </div>
        </div>

        <script src="script/showPass.js"></script>
        <script type="module">
            import { loginUser } from './script/getPostData.js';
            import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

            const submitButton = document.getElementById('log-btn');
            submitButton.addEventListener('click', async (event) =>{
                event.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    alert('Please fill in all fields');
                    return;
                }

                const auth = getAuth();
                signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in 
                    const user = userCredential.user;
                    alert('Log Masuk Berjaya');
                    window.location.href = 'mainPage.html';
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.log(errorMessage);

                    if (errorCode === 'auth/invalid-credential') {
                        alert('Emel atau Kata Laluan Tidak Sah');
                    }
                });
               
            });
        </script>
    </body>
        <div id="footer-placeholder"></div>

</html>
