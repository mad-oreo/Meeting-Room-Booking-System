<script>
  const arrow = document.getElementById('arrow-down');
  arrow.addEventListener('click', function() {
    const subMenu = document.getElementById('sub-menu');
    if (subMenu.style.display === 'block') {
      subMenu.style.display = 'none';
      arrow.textContent = 'keyboard_arrow_down';
    } else {
      subMenu.style.display = 'block';
      arrow.textContent = 'keyboard_arrow_up';
    }
  });
</script>
<script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.0/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script type="module">
  // Example fetch from Firestore or your backend:
  // Replace this with real data retrieval
  async function fetchBookings() {
    // Example data structure:
    // Each booking has { title, date, status, id, ... }
    return [
      { id: '1', title: 'Mesyuarat A', date: '2023-10-25', status: 'KIV' },
      { id: '2', title: 'Mesyuarat B', date: '2023-10-28', status: 'Pending' },
    ];
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      height: 'auto', // Fill remaining space
      locale: 'ms',
      events: [], // We'll load events below
      eventClick: async function(info) {
        const bookingId = info.event.id;
        const currentStatus = info.event.extendedProps.status || 'Unknown';
        // Simple prompt to set new status: Accept, KIV, Reject
        const newStatus = prompt(`Current status: ${currentStatus}\nSet new status (accept/kiv/reject):`, currentStatus);
        if (newStatus) {
          // Update the booking in Firestore / your backend
          console.log(`Booking ${bookingId} new status: ${newStatus}`);
          // Refresh the calendar or handle it as needed
        }
      },
    });

    // Fetch bookings and load into calendar
    const bookings = await fetchBookings();
    // Transform data to Calendar events
    let events = bookings.map(b => ({
      id: b.id,
      title: b.title,
      start: b.date,
      extendedProps: { status: b.status }
    }));

    // Add events to the calendar
    calendar.addEventSource(events);
    // Render
    calendar.render();
  });
</script>
