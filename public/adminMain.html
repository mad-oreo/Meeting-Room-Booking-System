  <script>
    // Toggle submenu
    const arrow = document.getElementById('arrow-down');
    arrow.addEventListener('click', function() {
      const subMenu = document.getElementById('sub-menu');
      if (subMenu.style.display === 'block') {
        subMenu.style.display = 'none';

  <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
  <script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.0/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

  <script type="module">
    import { db } from "./script/firebaseConfig.js";
    import {
      collection,
      getDocs,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
    import { formatDateToDDMMYYYY } from "./script/getSummaryData.js";

    // Fetch ONLY "approved" bookings from the Firestore collection
    async function fetchApprovedBookings() {
      const bookingSnapshot = await getDocs(collection(db, "bookingDetails"));
      const approved = [];
      bookingSnapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (data.status === "Diluluskan") {
          // Assign color based on sesi
          let eventColor = "";
          if (data.sesi === "pagi") {
            eventColor = "#ff9b57";
          } else if (data.sesi === "petang") {
            eventColor = "#6b8deb";
          } else {
            eventColor = "#3788d8"; // default color if needed
          }

          approved.push({
            id: docSnap.id,
            title: data.tajuk || "No Title",
            start: data.tarikh, // Must be a valid date string
            color: eventColor,
            extendedProps: {
              status: data.status,
              sesi: data.sesi
            }
          });
        }
      });
      return approved;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        locale: 'ms',
        events: [],
        // On event click, fetch document data and show in alert
        eventClick: async function(info) {
          const bookingId = info.event.id;

          try {
            const snap = await getDoc(doc(db, "bookingDetails", bookingId));
            if (snap.exists()) {
              const details = snap.data();
              alert(
                "ID Tempahan: " + bookingId + "\n" +
                "\nTajuk: " + (details.tajuk || "Tiada Tajuk") +
                "\nTarikh: " + (formatDateToDDMMYYYY(details.tarikh)|| "Tiada Tarikh") +
                "\nSesi: " + (details.sesi || "Tiada Sesi") +
                "\nStatus: " + (details.status || "Tidak Diketahui") +
                "\nTempahan Makanan: " + (details.makan === true ? "Ya" : "Tiada Tempahan Makanan") +
                "\nTempahan Minuman: " + (details.minum === true ? "Ya" : "Tiada Tempahan Minuman") 
              );
            } else {
              alert("Tiada tempahan dengan ID tersebut.");
            }
          } catch (error) {
            console.error("Ralat memuatkan data tempahan:", error);
            alert("Terdapat ralat semasa membaca data tempahan.");
          }
        },
      });

      // Fetch approved bookings and add them to the calendar
      const approvedBookings = await fetchApprovedBookings();
      calendar.addEventSource(approvedBookings);

      calendar.render();
    });
  </script>
