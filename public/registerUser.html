<script src="script/loadHeadFoot.js"></script>
<div id="header-placeholder"></div>

<div class="login-page">
        <div class="login-text">
            <h1>Daftar Akaun Baru</h1>
            <h4>Isi Maklumat Berikut Untuk Mendaftar</h4>
        </div>
        <div class="register-box">
            <form action="" method="POST">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Nama Pengguna:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="no-gaji"><i class="fas fa-gaji"></i> Nombor Gaji:</label>
                    <input type="number" id="no-gaji" name="no-gaji" required>
                </div>
                <div class="form-group">
                    <label for="jawatan"><i class="fas fa-jawatan"></i> Jawatan:</label>
                    <input type="text" id="jawatan" name="jawatan" required>
                </div>
                <div class="form-group">
                    <label for="email"><i class="fas fa-email"></i> Emel:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Kata Laluan:</label>
                    <div class="form-group-pic">
                        <input type="password" id="password" name="password" required>
                        <img src="img/eye-close.png" id="eye">
                    </div>
                </div>
                <button type="button" name="register" id="submit-info" class="login-btn">DAFTAR</button>
            </form>
            
            <p>Sudah Ada Akaun? <a href="loginPageUser.html">Log Masuk Di Sini</a></p>
        </div>
</div>

</body>

<script src="script/showPass.js"></script>

<script type="module">
import { auth, app, db } from './firebaseConfig.js';
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
import { setDoc, doc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
import { addUserData } from './script/getPostData.js';

const submitButton = document.getElementById('submit-info');
submitButton.addEventListener('click', async (event) => {
  event.preventDefault();

  const username = document.getElementById('username').value;
  const noGaji = document.getElementById('no-gaji').value;
  const jawatan = document.getElementById('jawatan').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  if (!username || !noGaji || !jawatan || !email || !password) {
    alert('Sila lengkapkan semua ruangan!');
    return;
  }

  const formData = {
    username: username,
    noGaji: noGaji,
    jawatan: jawatan
  };

  try {
    // Create auth user
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    console.log('User created successfully:', userCredential.user);

    // After successful user creation:
    const uid = userCredential.user.uid;

    // Use uid as the document ID in Firestore:
    await setDoc(doc(db, "userInfo", uid), {
      username: formData.username,
      noGaji: formData.noGaji,
      jawatan: formData.jawatan
    });

    // If auth is successful, post data
    alert('Akaun berjaya didaftarkan!');
    await addUserData(formData);
    console.log('Data posted successfully');
    window.location.href = 'loginPageUser.html';

  } catch (error) {
    console.error(error);
    const errorCode = error.code;
    const errorMessage = error.message;

    if (errorCode === 'auth/email-already-in-use') {
      alert('Emel ini telah digunakan sebelum ini!');
    } 
    else if (errorCode === 'auth/weak-password') {
      alert('Panjang kata laluan sekurang-kurangnya 6 karakter');
    } 
    else {
      alert(errorMessage);
    }
  }
});
</script>

<div id="footer-placeholder"></div>
