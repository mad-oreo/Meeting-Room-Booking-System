<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adminStyle.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:500&display=swap" rel="stylesheet">
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/3.3.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <title>Statistik Tempahan</title>
    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
      import { loadFavicon } from "./script/loadFaviconAdmin.js";
    </script>
    <!-- Firebase Firestore -->
    <script type="module">
        import { getDocs, collection } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { db } from "./script/firebaseConfig.js";

        const monthLabels = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
        // Each room will store two arrays of length 12, one for pagi, one for petang
        let roomStats = {
          zamrud: { pagi: Array(12).fill(0), petang: Array(12).fill(0) },
          delima: { pagi: Array(12).fill(0), petang: Array(12).fill(0) },
          nilam:  { pagi: Array(12).fill(0), petang: Array(12).fill(0) },
          safir:  { pagi: Array(12).fill(0), petang: Array(12).fill(0) },
        };

        let myChart;

        async function loadApprovedReport() {
          const bookingSnapshot = await getDocs(collection(db, "bookingDetails"));
          bookingSnapshot.forEach((doc) => {
            const data = doc.data();
            if (data.status === "Diluluskan") {
              const room = (data.namaBilik || "").toLowerCase(); // e.g. 'zamrud'
              if (!roomStats[room]) return; // Ignore unknown rooms
              const sesi = (data.sesi || "").toLowerCase();     // e.g. 'pagi', 'petang'
              const monthIndex = new Date(data.tarikh).getMonth();
              if (sesi === "pagi") {
                roomStats[room].pagi[monthIndex]++;
              } else if (sesi === "petang") {
                roomStats[room].petang[monthIndex]++;
              }
            }
          });
          // After data is loaded, render default room chart
          renderChart("zamrud");
        }

        function renderChart(roomKey) {
          if (myChart) myChart.destroy();
          const ctx = document.getElementById("myChart").getContext("2d");
          myChart = new Chart(ctx, {
            type: "bar",
            data: {
              labels: monthLabels,
              datasets: [
                {
                  label: "Sesi Pagi",
                  data: roomStats[roomKey].pagi,
                  backgroundColor: "rgba(255, 159, 64, 0.7)",
                },
                {
                  label: "Sesi Petang",
                  data: roomStats[roomKey].petang,
                  backgroundColor: "rgba(54, 162, 235, 0.7)",
                },
              ],
            },
            options: {
              responsive: true,
              plugins: {
                title: { display: true, text: `Statistik Tempahan (${roomKey.toUpperCase()})` },
              },
              scales: {
                y: {
                  beginAtZero: true,
                  title: { display: true, text: "Jumlah Tempahan" },
                },
              },
            },
          });
        }

        window.addEventListener("DOMContentLoaded", loadApprovedReport);

        // Handle room selection
        window.selectRoom = function(roomKey) {
          renderChart(roomKey);
        };
    </script>
</head>
<body>
  <aside class="sidebar">
    <header class="sidebar-header">
        <a href="adminMain.html" class="header-logo">
            <img src="img/Coat_of_Arms_of_Kuala_Lumpur.svg" alt="Logo DBKL">
        </a>
    </header>
    <nav class="sidebar-nav">
        <ul class="nav-list primary-nav">
          <li class="nav-item">
            <a href="adminMain.html" class="nav-link">
                <span class="material-symbols-outlined">home</span>
                <span class="nav-label">Laman Utama</span>
            </a>
        </li>
            <li class="nav-item">
                <a href="adminManageUser.html" class="nav-link">
                    <span class="material-symbols-outlined">manage_accounts</span>
                    <span class="nav-label">Urus Tempahan</span>
                </a>
            </li>
            <li class="nav-item">
                <div class="icon-link">
                    <a href="#" class="nav-link">
                        <span class="material-symbols-outlined">list</span>
                        <span class="nav-label">Senarai Tempahan</span>
                        <span class="material-symbols-outlined" id="arrow-down">keyboard_arrow_down</span>
                    </a>
                    <ul class="sub-menu">
                        <li><a href="adminApproved.html">Tempahan Diluluskan</a></li>
                        <li><a href="adminRejected.html">Tempahan Ditolak</a></li>
                        <li><a href="adminKIV.html">Tempahan Didalam Perhatian</a></li>
                    </ul>
                </div>
            </li>
            <li class="nav-item">
                <a href="adminReport.html" class="nav-link">
                    <span class="material-symbols-outlined">analytics</span>
                    <span class="nav-label">Statistik Tempahan</span>
                </a>
            </li>
        </ul>

        <ul class="nav-list secondary-nav">
            <li class="nav-item">
                <a href="adminProfile.html" class="nav-link">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="nav-label">Profil</span>
                </a>
            </li>
            
        </ul>
    </nav>
</aside>
  
  <!-- Main Content -->
  <div class="main-content">
    <h1>Statistik Tempahan</h1>
    <label for="roomSelect">Pilih Bilik:</label>
    <select id="roomSelect" onchange="selectRoom(this.value)">
      <option value="zamrud">Bilik Zamrud</option>
      <option value="delima">Bilik Delima</option>
      <option value="nilam">Bilik Nilam</option>
      <option value="safir">Bilik Safir</option>
    </select>
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>
</body>
</html>
