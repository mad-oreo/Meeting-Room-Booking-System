    <link 
      rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
</head>
<body>

        </button>
    </header>

    <nav class="sidebar-nav">
        <ul class="nav-list primary-nav">
            <li class="nav-item">
                <a href="adminManageUser.html" class="nav-link">
                    <span class="material-symbols-outlined">home</span>
                    <span class="nav-label">Mengurus Tempahan</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="material-symbols-outlined">home</span>
                    <span class="nav-label">Mengurus Bilik</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="material-symbols-outlined">home</span>

                </a>

        </ul>

        <ul class="nav-list secondary-nav">
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="nav-label">Profil</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="nav-label">Log Keluar</span>
                </a>
            </li>
        </ul>
    </nav>
  </aside>  

  <div class="main-content p-4">
    <div class="header mb-4">
      <h1>Senarai Pengguna Tidak Diluluskan</h1>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Bilik</th>
            <th>Tajuk Mesyuarat</th>
            <th>Tarikh</th>
            <th>Sesi</th>
            <th>Sebab Mesyuarat</th>
            <th>Tempahan Makanan</th>
            <th>Tempahan Minuman</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows will be dynamically generated here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS (optional) -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>
  <script type="module">
    import { getDocs, getDoc, collection, doc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
    import { db } from "/public/firebaseConfig.js";
    import { formatDateToDDMMYYYY } from "./script/getSummaryData.js";

    async function loadRejectedBookings() {
      const bookingSnapshot = await getDocs(collection(db, "bookingDetails"));

      // Clear existing rows
      const tableBody = document.querySelector("tbody");
      tableBody.innerHTML = "";

      // For each booking, find its associated user data by userId
      const bookingDocs = bookingSnapshot.docs; // convert to array
      let rowNumber = 0;

      for (let index = 0; index < bookingDocs.length; index++) {
        const bookingDoc = bookingDocs[index];
        const bookingData = bookingDoc.data();

        // Only process approved bookings
        if (bookingData.status !== "rejected") continue;

        // Fetch the user document referenced by userId
        const userRef = doc(db, "userInfo", bookingData.userID); // Assuming userId is a string
        const userDoc = await getDoc(userRef);
        const userData = userDoc.exists() ? userDoc.data() : {};

        // Row numbering
        rowNumber++;

        // Format the date to ddmmyyyy
        const formattedDate = formatDateToDDMMYYYY(bookingData.tarikh);

        // Create a row with combined user + booking data
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${rowNumber}</td>
          <td>${userData.username ?? "N/A"}</td>
          <td>${bookingData.namaBilik ?? "N/A"}</td>
          <td>${bookingData.tajuk ?? "N/A"}</td>
          <td>${formattedDate}</td>
          <td>${bookingData.sesi ?? "N/A"}</td>
          <td>${bookingData.sebab ?? "N/A"}</td>
          <td>${bookingData.makan ? "✔️" : "❌"}</td>
          <td>${bookingData.minum ? "✔️" : "❌"}</td>
        `;
        tableBody.appendChild(row);
      }
    }

    window.addEventListener("DOMContentLoaded", loadRejectedBookings);
  </script>
</body>
</html>
