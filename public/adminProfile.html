<script type="module">
    import { getDocs, getDoc, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
import { db } from "./script/firebaseConfig.js";
import { getAdminData, getCurrentUser } from "./script/authAdmin.js";
import { getAuth, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

let initialValues = {}; // store the original values for comparison

async function loadAdminProfile() {
  try {
    const currUserData = await getAdminData();
    console.log("Current User:", currUserData);

    if (currUserData.length > 0) {
      const user = currUserData[0];
      // populate the input fields
      document.getElementById("username").value = user.username;
      document.getElementById("noGaji").value = user.noGaji;
      document.getElementById("jawatan").value = user.jawatan;

      // store the original values
      initialValues = {
        username: user.username || "",
        noGaji: user.noGaji || "",
        jawatan: user.jawatan || "",
        id: user.userID // make sure you keep track of the user doc ID somewhere
      };
    }

    // 2) Load the current Auth user (to get Auth email)
    const currentUserAuth = await getCurrentUser();
    if (currentUserAuth) {
      // Display Auth email in the 'email' input
      document.getElementById("email").value = currentUserAuth.email || "";
      initialValues.email = currentUserAuth.email || "";
    }
  } catch (error) {
    console.error("Error loading user profile:", error);
    alert("Terdapat ralat semasa memuatkan profil pengguna. Sila cuba lagi.");
  }
}
loadAdminProfile();

async function updateAdminProfile() {
  try {
    const username = document.getElementById("username").value;
    const noGaji = document.getElementById("noGaji").value;
    const jawatan = document.getElementById("jawatan").value;
    const email = document.getElementById("email").value;

    // compare old vs new
    const changes = {};
    if (username !== initialValues.username) changes.username = username;
    if (noGaji !== initialValues.noGaji) changes.noGaji = noGaji;
    if (jawatan !== initialValues.jawatan) changes.jawatan = jawatan;

    // if there are changes, merge them
    if (Object.keys(changes).length > 0) {
      const currUser = await getCurrentUser();
      if (currUser) {
        // Get the real auth user instance
        const authUser = getAuth().currentUser;

        const docId = initialValues.uid || currUser.uid;
        const userRef = doc(db, "adminInfo", docId);
        await setDoc(userRef, changes, { merge: true });
        alert("Profil Pengguna Berjaya Dikemaskini!");

        // Update initialValues with new changes
        Object.assign(initialValues, changes);
      }
    } else {
      alert("Tiada perubahan dikesan.");
    }
  } catch (error) {
    console.error("Error updating user profile:", error);
    alert("Terdapat ralat semasa mengemaskini profil pengguna. Sila cuba lagi.");
  }
}

document.getElementById("update-profile-btn").addEventListener("click", updateAdminProfile);

const auth = getAuth();


async function updateAdminPassword() {
  const auth = getAuth();
  const user = auth.currentUser;
  if (!user) return;

  const oldPassword = document.getElementById("old-password").value.trim();
  const newPassword = document.getElementById("new-password").value.trim();
  const confirmPassword = document.getElementById("confirm-password").value.trim();

  if (!oldPassword) {
    alert("Sila masukkan kata laluan lama anda untuk pengesahan.");
    return;
  }

  try {
    const credential = EmailAuthProvider.credential(user.email, oldPassword);
    await reauthenticateWithCredential(user, credential);

    // Now update the password
    if (newPassword) {
      if (newPassword.length < 6) {
        alert("Kata laluan baru hendaklah sekurang-kurangnya 6 aksara.");
        return;
      }
      if (newPassword !== confirmPassword) {
        alert("Kata laluan tidak sepadan.");
        return;
      }
      await updatePassword(user, newPassword);
      alert("Kata laluan berjaya ditukar!");
    } else {
      alert("Tiada tindakan diambil. Sila masukkan kata laluan baharu.");
    }
  } catch (error) {
    console.error("Masalah mengemaskini profil pengguna:", error);
    alert("Terdapat ralat semasa mengemaskini profil pengguna. Sila cuba lagi.");
  }
}

document.getElementById('update-pass').addEventListener('click', updateAdminPassword);

document.getElementById('logout-btn').addEventListener('click', async () => {
  const auth = getAuth();
  try {
    await auth.signOut();
    window.location.href = 'adminLogin.html';
  } catch (error) {
    console.error("Error signing out:", error);
    alert("Terdapat ralat semasa log keluar. Sila cuba lagi.");
  }
});
</script>
