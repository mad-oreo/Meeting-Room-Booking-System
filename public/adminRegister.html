<script src="script/loadHeadFoot.js"></script>
<div id="header-placeholder"></div>

<div class="login-page">
        <div class="login-text">
            <h1>Daftar Akaun Baru Pentadbir</h1>
            <h4>Isi Maklumat Berikut Untuk Mendaftar</h4>
        </div>
        <div class="register-box">
            <form action="" method="POST">
                <div class="form-group register-info">
                    <label for="username"><i class="fas fa-user"></i> Nama Pengguna:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group register-info">
                    <label for="no-gaji"><i class="fas fa-gaji"></i> Nombor Gaji:</label>
                    <input type="number" id="no-gaji" name="no-gaji" required>
                </div>
                <div class="form-group register-info">
                    <label for="no-ic"><i class="fas fa-ic"></i> Nombor Kad Pengenalan:</label>
                    <input type="number" id="no-ic" name="no-ic" required>
                </div>
                <div class="form-group register-info">
                    <label for="jawatan"><i class="fas fa-jawatan"></i> Jawatan:</label>
                    <input type="text" id="jawatan" name="jawatan" required>
                </div>
                <div class="form-group register-info">
                    <label for="email"><i class="fas fa-email"></i> Emel:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group register-info">
                    <label for="password"><i class="fas fa-lock"></i> Kata Laluan:</label>
                    <div class="form-group-pic register">
                        <input type="password" id="password" name="password" required>
                        <img src="img/eye-close.png" id="eye">
                    </div>
                </div>
                <button type="submit" name="register" id="submit-btn-admin" class="login-btn">DAFTAR</button>
            </form>
            
            <p>Sudah Ada Akaun? <a href="adminLogin.html">Log Masuk Di Sini</a></p>
        </div>
</div>

</body>
<script src="script/showPass.js"></script>
<script type="module">
    import { adminRegister } from './script/authAdmin.js';
    adminRegister();
</script>

<div id="footer-placeholder"></div>
